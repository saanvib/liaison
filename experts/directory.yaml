# Expert directory (D10, D11): the three team members, each covering one or two topics.
# The expertise text is the demo product's (a DNA extraction kit and its analyzer), so seeded questions
# still match; the people and Slack IDs are real members of the team's Slack workspace.
# Each summary line is matched separately (job-description bullets, project and meeting-note snippets),
# and an expert scores as their best-matching line, so keep lines short and on one subject.
# Don't put product names (e.g. GX-200) in summaries: most questions mention the product, so the
# name would pull unrelated questions toward whoever's line contains it.
# An expert with several topics is routed to the one the question is about (see matcher.py).
# The Slack IDs here must equal APPROVER_ALLOWLIST in the Vendor Agent's env:
#   python -m experts.print_allowlist

experts:
  - id: saanvi
    slack_user_id: U0C9YESNKB7
    display_name: Saanvi
    role: R&D Scientist, Assay Development and Sample Preparation
    topics: [rd]
    summary: |
      Leads assay development for the DNA extraction kits.
      Lysis chemistry, binding buffers and elution conditions.
      DNA and RNA yield, purity and inhibitor carryover in the eluate.
      Proteinase K digestion time and incubation temperature.
      Project: limit of detection, sensitivity and reproducibility for low-input samples.
      Meeting notes: low yield from plasma fixed with an extra wash step.
      Customer protocols for sample preparation and sample handling.
      Sample input volumes for serum, plasma and whole blood.
      Sample storage, freeze-thaw cycles and transport of samples.
      Downstream PCR, qPCR and sequencing workflows.
      Troubleshooting high Ct values, failed amplification and contaminated negative controls.
      Meeting notes: spin column clogging and centrifuge speed during the protocol.

  - id: neha
    slack_user_id: U0C9YET9PM3
    display_name: Neha
    role: Quality, Regulatory and Sales Operations Manager
    topics: [qa_ra, sales_ops]
    summary: |
      Regulatory status of products: Research Use Only (RUO) versus IVD.
      Intended use statements, labeling and IFU claims.
      CE marking, IVDR and EU regulatory requirements.
      FDA registration and US regulatory questions.
      Compliance declarations such as REACH and RoHS.
      Meeting notes: reviewed marketing claims on a datasheet for regulatory compliance.
      Lot release and certificates of analysis (CoA) for kit lots.
      Quality management system and ISO 13485 audits.
      Customer complaints, nonconformance investigations and CAPA.
      Product recalls and field safety notices.
      Stability studies, shelf life and expiry dates of reagents.
      Meeting notes: supplied lot traceability records for a customer audit.
      Pricing, quotes and discounts for kits and analyzers.
      Contract terms, volume agreements and multi-year supply contracts.
      Distributor pricing and partner agreements.
      Purchase orders, invoices and payment terms.
      Service contracts and warranty extensions.
      Meeting notes: prepared a quote for a bulk order of 500 kits.

  - id: manasvini
    slack_user_id: U0CA5L9TELR
    display_name: Manasvini
    role: Engineering and Logistics Lead
    topics: [engineering, sales_ops]
    summary: |
      GX analyzer hardware, firmware and field service.
      Analyzer error codes, including E42 lid sensor errors.
      Instrument calibration and preventive maintenance.
      Heater temperature, motors, sensors and the centrifuge module.
      Analyzer installation and installation qualification.
      Meeting notes: diagnosed an analyzer power failure and motor noise.
      Analyzer control software and run reports.
      Data export of run results to CSV and LIMS.
      LIMS integration API and barcode sample tracking.
      Software updates, user accounts and audit trail logging.
      Control PC setup and Windows compatibility.
      Meeting notes: fixed a data export bug that dropped sample IDs from run reports.
      Order status, shipping and delivery dates.
      Backorders, stock levels and lead times for kits and spare parts.
      Dry ice packaging and cold chain shipping.
      International shipments, customs and import documents.
      Damaged or lost packages and replacement shipments.
      Meeting notes: expedited a delayed shipment for a customer.
