# Slack app manifest for Liaison (api.slack.com/apps > Create New App > From an app manifest).
display_information:
  name: Liaison
  description: Answers product questions from company documents and routes the rest to experts.
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Liaison
    always_online: true
  slash_commands:
    - command: /ask
      description: Ask Liaison a product question
      usage_hint: "<your question>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - commands
      - groups:history
      - im:history
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
